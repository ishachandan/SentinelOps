version: '3.8'

services:
  sentinelops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelops
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - USE_REAL_APIS=true
      - ENABLE_DEBUG_ENDPOINTS=false
    volumes:
      # SQLite WAL needs local storage shared by Flask and its MCP subprocess.
      - sentinelops-data:/app/data
      # Optional: Mount logs for debugging
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentinelops-network

networks:
  sentinelops-network:
    driver: bridge

volumes:
  sentinelops-data:
