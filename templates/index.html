<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelOps - Security Copilot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: #2d2d2d;
            padding: 1rem 2rem;
            border-bottom: 2px solid #00ff88;
        }
        
        h1 {
            color: #00ff88;
            font-size: 1.5rem;
        }
        
        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }
        
        #transcript {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 2rem;
            background: #1a1a1a;
        }
        
        .message {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            max-width: 80%;
        }
        
        .user-message {
            background: #2d4a7c;
            margin-left: auto;
        }
        
        .agent-message {
            background: #2d2d2d;
            border-left: 3px solid #00ff88;
        }
        
        .tool-call {
            background: #3d2d4a;
            border-left: 3px solid #a855f7;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .tool-result {
            background: #2d3d2d;
            border-left: 3px solid #4ade80;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
        
        .pending-confirmation {
            background: #4a3d2d;
            border-left: 3px solid #f59e0b;
            border: 2px solid #f59e0b;
        }
        
        .confirmation-buttons {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }
        
        .confirm-btn {
            padding: 0.5rem 1rem;
            background: #10b981;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        .confirm-btn:hover {
            background: #059669;
        }
        
        .decline-btn {
            padding: 0.5rem 1rem;
            background: #ef4444;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        .decline-btn:hover {
            background: #dc2626;
        }
        
        .action-result {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .action-confirmed {
            background: #10b981;
            color: white;
        }
        
        .action-declined {
            background: #6b7280;
            color: white;
        }
        
        .timestamp {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.25rem;
        }
        
        .input-area {
            background: #2d2d2d;
            padding: 1rem 2rem;
            border-top: 1px solid #444;
            display: flex;
            gap: 0.5rem;
        }
        
        #messageInput {
            flex: 1;
            padding: 0.75rem;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 1rem;
        }
        
        #messageInput:focus {
            outline: none;
            border-color: #00ff88;
        }
        
        button {
            padding: 0.75rem 1.5rem;
            background: #00ff88;
            border: none;
            border-radius: 4px;
            color: #1a1a1a;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        
        button:hover {
            background: #00dd77;
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        .clear-btn {
            background: #666;
            color: #e0e0e0;
        }
        
        .clear-btn:hover {
            background: #777;
        }
        
        .loading {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <h1>SentinelOps</h1>
        <div class="subtitle">Security Copilot - Web Interface</div>
    </header>
    
    <div id="transcript"></div>
    
    <div class="input-area">
        <input 
            type="text" 
            id="messageInput" 
            placeholder="Ask about security events, IP reputation, or request actions..."
            autofocus
        />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
        <button class="clear-btn" onclick="clearConversation()">Clear</button>
    </div>
    
    <script>
        const transcript = document.getElementById('transcript');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        function addToTranscript(entry) {
            const div = document.createElement('div');
            
            if (entry.type === 'user') {
                div.className = 'message user-message';
                div.innerHTML = `
                    <div>${escapeHtml(entry.content)}</div>
                    <div class="timestamp">${formatTime(entry.timestamp)}</div>
                `;
            } else if (entry.type === 'agent') {
                div.className = 'message agent-message';
                div.innerHTML = `
                    <div>${escapeHtml(entry.content)}</div>
                    <div class="timestamp">${formatTime(entry.timestamp)}</div>
                `;
            } else if (entry.type === 'tool_call') {
                div.className = 'message tool-call';
                const args = JSON.stringify(entry.tool_args, null, 2);
                div.innerHTML = `
                    <div><strong>Tool Call:</strong> ${escapeHtml(entry.tool_name)}</div>
                    <div style="margin-top: 0.5rem;">Arguments: ${escapeHtml(args)}</div>
                    <div class="timestamp">${formatTime(entry.timestamp)}</div>
                `;
            } else if (entry.type === 'tool_result') {
                div.className = 'message tool-result';
                div.innerHTML = `
                    <div><strong>Result:</strong></div>
                    <div style="margin-top: 0.5rem;">${escapeHtml(entry.content)}</div>
                    <div class="timestamp">${formatTime(entry.timestamp)}</div>
                `;
            } else if (entry.type === 'pending_confirmation') {
                div.className = 'message pending-confirmation';
                div.id = 'pending-' + entry.token;
                div.innerHTML = `
                    <div><strong>WARNING: PENDING ACTION REQUIRES CONFIRMATION:</strong></div>
                    <div style="margin-top: 0.5rem;">${escapeHtml(entry.content)}</div>
                    <div class="confirmation-buttons">
                        <button class="confirm-btn" onclick="confirmAction('${entry.token}')">Confirm</button>
                        <button class="decline-btn" onclick="declineAction('${entry.token}')">Decline</button>
                    </div>
                    <div id="result-${entry.token}"></div>
                    <div class="timestamp">${formatTime(entry.timestamp)}</div>
                `;
            }
            
            transcript.appendChild(div);
            transcript.scrollTop = transcript.scrollHeight;
        }
        
        async function confirmAction(token) {
            try {
                const response = await fetch(`/confirm/${token}`, { method: 'POST' });
                const data = await response.json();
                
                const resultDiv = document.getElementById('result-' + token);
                const buttonsDiv = document.getElementById('pending-' + token).querySelector('.confirmation-buttons');
                
                if (data.success) {
                    resultDiv.className = 'action-result action-confirmed';
                    resultDiv.textContent = 'CONFIRMED AND EXECUTED: ' + data.result;
                    buttonsDiv.remove();
                } else {
                    resultDiv.className = 'action-result action-declined';
                    resultDiv.textContent = 'ERROR: ' + data.error;
                }
            } catch (error) {
                alert('Error confirming action: ' + error.message);
            }
        }
        
        async function declineAction(token) {
            try {
                const response = await fetch(`/decline/${token}`, { method: 'POST' });
                const data = await response.json();
                
                const resultDiv = document.getElementById('result-' + token);
                const buttonsDiv = document.getElementById('pending-' + token).querySelector('.confirmation-buttons');
                
                if (data.success) {
                    resultDiv.className = 'action-result action-declined';
                    resultDiv.textContent = 'DECLINED: ' + data.message;
                    buttonsDiv.remove();
                } else {
                    resultDiv.className = 'action-result action-declined';
                    resultDiv.textContent = 'ERROR: ' + data.error;
                }
            } catch (error) {
                alert('Error declining action: ' + error.message);
            }
        }
        
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            messageInput.value = '';
            sendBtn.disabled = true;
            
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message loading';
            loadingDiv.textContent = 'Processing...';
            transcript.appendChild(loadingDiv);
            
            try {
                const response = await fetch('/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                
                loadingDiv.remove();
                
                if (!response.ok) {
                    const error = await response.json();
                    alert('Error: ' + (error.error || 'Unknown error'));
                    return;
                }
                
                const data = await response.json();
                data.transcript.forEach(entry => addToTranscript(entry));
                
            } catch (error) {
                loadingDiv.remove();
                alert('Error: ' + error.message);
            } finally {
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }
        
        async function clearConversation() {
            if (!confirm('Clear conversation history?')) return;
            
            try {
                await fetch('/clear', { method: 'POST' });
                transcript.innerHTML = '';
            } catch (error) {
                alert('Error clearing conversation: ' + error.message);
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString();
        }
    </script>
</body>
</html>
